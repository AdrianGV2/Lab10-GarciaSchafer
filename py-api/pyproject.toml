[project]
name = "manito-api"
version = "0.1.0"
description = "Python client for the Manito SCARA robot arm, for both the real driver and the Genesis simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
examples = [
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manito_api"]
