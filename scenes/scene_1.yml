# Ancla los objetos simbolicos de problems/problem_1.pddl a coordenadas
# reales de genesis-sim/configs/scenarios/lab10_scene_1.yml.
#
# Las coordenadas de las zonas son las mismas posiciones (pos:) que los
# objetos tienen en esa escena: una zona es simplemente un punto de la mesa,
# no una entidad renderizada.
genesis_scenario: "configs/scenarios/lab10_scene_1.yml"

cube_size: 0.04

zones:
  zona-a: [0.15, 0.10, 0.02]
  zona-b: [0.15, -0.10, 0.02]

# cubo PDDL -> entidad en genesis-sim (para verificar la posicion inicial)
cubes:
  cubo-a: "Cubo A"
  cubo-b: "Cubo B"
